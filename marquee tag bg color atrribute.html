<html>
<body>

<h2>Marquee bgcolor Attribute Example</h2>

<marquee bgcolor="orange">
Scrolling text with orange background
</marquee>

<marquee bgcolor="white" behavior="slide"><font color="blue">
Slide text with light green background</font>
</marquee>

<marquee bgcolor="green" behavior="alternate">
Bouncing text with green background
</marquee>

</body>
</html>
