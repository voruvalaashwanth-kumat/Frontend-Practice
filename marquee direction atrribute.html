 <html>
<body>

<h2>Marquee Direction Attribute Example</h2>

<marquee direction="left">
Default direction – Left
</marquee>

<marquee direction="right">
Right direction
</marquee>

<marquee direction="up" height="60">
Up direction
</marquee>

<marquee direction="down" height="60" bgcolor="green">
Down direction
</marquee>

</body>
