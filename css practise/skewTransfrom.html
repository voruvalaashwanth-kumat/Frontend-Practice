<html>
<head>
<style>
img{
width:300px;
border-radius:11%;
transition:2s;
}
#img1:hover{
transform:skewX(20deg);
}
#img2:hover{
transform:skewY(20deg);
}
#img3:hover
{
transform:skew(20deg,30deg);
}
#img4:hover{
transform:skewX(45deg);
}
</style>
</head>
<body>
<img id="img1" src="pizza.jpg">
<img  id="img2" src="pizza.jpg">
<img id="img3" src="pizza.jpg">
<img id="img4" src="pizza.jpg">
</body>
</html>
