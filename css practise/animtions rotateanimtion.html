<!DOCTYPE html>
<html>
<head>
<style>

div{
background-color:blue;

width:300px;
height:300px;
animation-name:rotateimage;

animation-duration:3s;

}

@keyframes rotateimage{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}

</style>
</head>

<body>

<div></div>

</body>
</html>
