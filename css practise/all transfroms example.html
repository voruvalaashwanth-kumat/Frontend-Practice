<html>
<head>
<style>
img{
width:300px;
border-radius:11%;
transition:2s;
}
#img1:hover{
transform:scale(1.5);
}
#img2:hover{
transform:rotate(180deg);
}
#img3:hover
{
transform:translateX(100px);
}
#img4:hover{
transform:skewX(45deg);
}
</style>
</head>
<body>
<img id="img1" src="pizza.jpg"><br><br>
<img  id="img2" src="pizza.jpg"><br><br>
<img id="img3" src="pizza.jpg"><br><br>
<img id="img4" src="pizza.jpg"><br><br>
</body>
</html>
