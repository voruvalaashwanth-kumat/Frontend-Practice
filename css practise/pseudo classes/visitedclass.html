<!DOCTYPE html>
<html>
<head>
    <title>CSS Visited Pseudo-Class</title>

    <style>

        /*
        CSS Pseudo-Class: :visited

        :visited is used to style a link
        after the user has already visited that link.

        It is mainly used with the <a> element.
        */

        a {
            color: blue;
        }

        /*
        When the user visits the link,
        the :visited style can be applied.
        */

        a:visited {
            color: purple;
        }

    </style>
</head>

<body>

    <a href="https://www.google.com">
        Visit Google
    </a>

</body>
</html>
