<!DOCTYPE html>
<html>
<head>
    <title>CSS First Child Pseudo-Class</title>

    <style>

        /*
        CSS Pseudo-Class: :first-child

        :first-child selects an element
        if it is the first child of its parent.

        It checks the position of the element
        inside its parent.
        */

        p:first-child {
            color: red;
        }

    </style>
</head>

<body>

    <div>

        <p>First Paragraph</p>
        <p>Second Paragraph</p>
        <p>Third Paragraph</p>

    </div>

</body>
</html>
