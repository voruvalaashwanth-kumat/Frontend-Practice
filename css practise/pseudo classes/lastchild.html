<!DOCTYPE html>
<html>
<head>
    <title>CSS Last Child Pseudo-Class</title>

    <style>

        /*
        CSS Pseudo-Class: :last-child

        :last-child selects an element
        if it is the last child of its parent.

        It checks the position of the element
        inside its parent.
        */

        p:last-child {
            color: red;
        }

    </style>
</head>

<body>

    <div>

        <p>First Paragraph</p>
        <p>Second Paragraph</p>
        <p>Last Paragraph</p>

    </div>

</body>
</html>
