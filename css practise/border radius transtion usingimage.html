<!DOCTYPE html>
<html>
<head>
<style>
h1{
text-align:center;}

img{

width:300px;

transition:2s;

}

img:hover{

border-radius:25%;

}

</style>
</head>

<body>

<img src="pizza.jpg">
<h1><h1>The image corners slowly become rounded to 25% when the mouse pointer is placed on the image.</h1></h1>
</body>
</html>
