<!DOCTYPE html>
<html>
<head>
<style>

img{

width:200px;
border-radius:11%;

transition:2s;

}



#img1:hover{

transform:translateY(100px);

}



#img2:hover{

transform:translateY(-100px);

}


#img3:hover{

transform:translateX(100px);

}



#img4:hover{

transform:translateX(-100px);

}

</style>
</head>

<body>

<img id="img1" src="pizza.jpg">

<img id="img2" src="pizza.jpg">

<img id="img3" src="pizza.jpg">

<img id="img4" src="pizza.jpg">

</body>
</html>
