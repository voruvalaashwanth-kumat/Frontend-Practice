<html>
<body>

<h2>Array Destructuring Example</h2>

<script>

let student = ["Ashu", 21, "BTech", "Java"];

let [name, age, course, skill] = student;

document.write("Name : " + name);
document.write("<br>");

document.write("Age : " + age);
document.write("<br>");

document.write("Course : " + course);
document.write("<br>");

document.write("Skill : " + skill);

</script>

</body>
</html>
