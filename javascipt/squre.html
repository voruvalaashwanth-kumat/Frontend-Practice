
<html>
<head>
    <title>Squares and Cubes</title>
</head>
<body>
<table border="1" cellpadding="10" cellspacing="0">
    <tr>
 <th>Number</th>
<th>Square</th>
 <th>Cube</th>
        
    </tr>
<script>
for(let n = 0; n <= 10; n++) {
   document.writeln("<tr>");
   document.writeln("<td>" + n + "</td>");
  document.writeln("<td>" + (n * n) + "</td>");
document.writeln("<td>" + (n * n * n) + "</td>");
     document.writeln("</tr>");
}
</script>
</table>
</body>
</html>
