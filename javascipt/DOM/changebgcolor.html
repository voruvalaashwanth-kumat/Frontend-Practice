<!DOCTYPE html>
<html>

<head>
    <title>Background Color</title>
</head>

<body>

    <h1 id="heading">Welcome Ashu</h1>

    <button onclick="changeBackground()">
        Change Background
    </button>

    <script>

        function changeBackground() {

            let heading = document.getElementById("heading");

            heading.style.backgroundColor = "yellow";

        }

    </script>

</body>

</html>
