<!DOCTYPE html>
<html>

<head>
    <title>Hide Element</title>
</head>

<body>

    <h1 id="heading">Welcome Ashu</h1>

    <button onclick="hideHeading()">
        Hide
    </button>

    <script>

        function hideHeading() {

            let heading = document.getElementById("heading");

            heading.style.display = "none";

        }

    </script>

</body>

</html>
