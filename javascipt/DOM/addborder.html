<!DOCTYPE html>
<html>

<head>
    <title>Add Border</title>
</head>

<body>

    <h1 id="heading">Welcome Ashu</h1>

    <button onclick="addBorder()">
        Add Border
    </button>

    <script>

        function addBorder() {

            let heading = document.getElementById("heading");

            heading.style.border = "3px solid red";

        }

    </script>

</body>

</html>
