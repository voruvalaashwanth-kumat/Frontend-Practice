<!DOCTYPE html>
<html>

<head>
    <title>Change Width</title>
</head>

<body>

    <div id="box" style="border:2px solid black;">
        JavaScript DOM
    </div>

    <br>

    <button onclick="changeWidth()">
        Change Width
    </button>

    <script>

        function changeWidth() {

            let box = document.getElementById("box");

            box.style.width = "400px";

        }

    </script>

</body>

</html>
