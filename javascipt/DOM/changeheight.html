<!DOCTYPE html>
<html>

<head>
    <title>Change Height</title>
</head>

<body>

    <div id="box" style="border:2px solid blue;">
        JavaScript DOM
    </div>

    <br>

    <button onclick="changeHeight()">
        Change Height
    </button>

    <script>

        function changeHeight() {

            let box = document.getElementById("box");

            box.style.height = "200px";

        }

    </script>

</body>

</html>
