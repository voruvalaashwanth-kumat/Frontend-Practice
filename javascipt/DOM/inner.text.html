<!DOCTYPE html>
<html>

<head>
    <title>innerText Example</title>
</head>

<body>

    <h1 id="title">Welcome Ashu</h1>

    <button onclick="changeText()">
        Change Text
    </button>

    <script>
function changeText() {

    let heading = document.getElementById("title");

    heading.innerText = "Welcome to JavaScript";

}
</script>

</body>

</html>
