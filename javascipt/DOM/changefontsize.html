<!DOCTYPE html>
<html>

<head>
    <title>Font Size</title>
</head>

<body>

    <h1 id="heading">Welcome Ashu</h1>

    <button onclick="changeFontSize()">
        Increase Font Size
    </button>

    <script>

        function changeFontSize() {

            let heading = document.getElementById("heading");

            heading.style.fontSize = "50px";

        }

    </script>

</body>

</html>
