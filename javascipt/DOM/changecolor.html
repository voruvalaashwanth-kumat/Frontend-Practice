<!DOCTYPE html>
<html>

<head>
    <title>Change Text Color</title>
</head>

<body>

    <h1 id="heading">Welcome Ashu</h1>

    <button onclick="changeColor()">
        Change Color
    </button>

    <script>

        function changeColor() {

            let heading = document.getElementById("heading");

            heading.style.color = "blue";

        }

    </script>

</body>

</html>
