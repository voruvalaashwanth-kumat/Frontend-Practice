<html>
<body>

<h2>Marquee Loop Attribute Example</h2>

<marquee loop="1" bgcolor="orange">
Loop once
</marquee>

<marquee loop="3" ><font color="blue">
Loop three times</font>
</marquee>

<marquee direction="alternate" loop="5" bgcolor="lightgreen">
Bouncing text for 5 times
</marquee>

</body>
</html>
