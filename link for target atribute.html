<!DOCTYPE html>
<html>
<head>
    <title>Anchor Tag Demo</title>
</head>
<body>

<h2>Anchor Tag Examples</h2>

<!-- Basic Link -->
<a href="https://www.google.com">Go to Google</a>
<br><br>

<!-- Open in New Tab -->
<a href="https://youtube.com" target="_blank">Open YouTube in New Tab</a>
<br><br>

<!-- Tooltip -->
<a href="https://facebook.com" title="Open Facebook">Facebook</a>
<br><br>
<a href="https://youtube.com" target="parent">Open YouTube in parent tab</a>
<br><br>




</body>
</html>
